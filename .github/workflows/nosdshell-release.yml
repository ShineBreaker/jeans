name: nosDShell Release Pin

# nosDShell 的发版 CI 在 tag 发布后调用本 workflow：把 channel 里的
# nosdshell pin 跟到该 tag，并开 PR 等人工 merge。
#
# 更新本身复用 scripts/check-updates/update_versions.py —— 它对 nosdshell
# 的共享变量结构（%nosdshell-version + %nosdshell-source）已有完整支持，
# --only 保证其余包本轮不检查、不落盘。这里不重写 hash 计算，避免和
# 定时更新的行为漂移。
#
# 触发方需要对该仓库有 actions:write 的 PAT（nosDShell 侧 JEANS_TOKEN）。
# PR 由本仓库的 GITHUB_TOKEN 创建（contents + pull-requests），不需要别的密钥。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "nosDShell release tag, e.g. v1.7.3"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nosdshell-release-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install requests

      - name: Update the nosdshell pin
        id: updater
        run: |
          set +e
          python3 scripts/check-updates/update_versions.py --only nosdshell
          status=$?
          # 0 = 无更新，1 = 有更新，>1 = 脚本级错误（与定时更新同一约定）
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the pin matches the requested tag
        if: steps.updater.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^(define %nosdshell-version "\(.*\)")$/\1/p' \
            modules/jeans/packages/desktop.scm)
          want="${RELEASE_TAG#v}"
          if [ "$pinned" != "$want" ]; then
            echo "updater pinned ${pinned}, but the requested release is ${want}." >&2
            echo "上游存在更新的 release，确认后再重跑（不会开 PR）。" >&2
            exit 1
          fi

      - name: Configure GPG signing
        # main 上每个 commit 都要过 `guix git authenticate`，无签名的 commit
        # 会让所有 clone 的 `guix pull` 直接失败。PR commit 必须在创建时就
        # 签好，不能指望合并时补（rebase 不会重签，GitHub 网页合并只会换成
        # web-flow 的签名，同样过不了认证）。
        if: steps.updater.outputs.changed == 'true'
        shell: bash
        env:
          WORKFLOW_GPG_PRIVATE_KEY: ${{ secrets.WORKFLOW_GPG_PRIVATE_KEY }}
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
          WORKFLOW_GPG_FINGERPRINT: ${{ vars.WORKFLOW_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail

          if [ -z "${WORKFLOW_GPG_PRIVATE_KEY:-}" ]; then
            echo "GitHub secret WORKFLOW_GPG_PRIVATE_KEY is required" >&2
            exit 1
          fi
          if [ -z "${WORKFLOW_GPG_FINGERPRINT:-}" ]; then
            echo "GitHub variable WORKFLOW_GPG_FINGERPRINT is required" >&2
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP:-/tmp}/jeans-workflow-gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"

          printf '%s\n' "$WORKFLOW_GPG_PRIVATE_KEY" | gpg --batch --import

          key_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$key_fpr" ]; then
            echo "Unable to determine imported signing key fingerprint" >&2
            exit 1
          fi
          expected_fpr="$(printf '%s' "$WORKFLOW_GPG_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual_fpr="$(printf '%s' "$key_fpr" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_fpr" != "$expected_fpr" ]; then
            echo "Imported GPG key fingerprint does not match WORKFLOW_GPG_FINGERPRINT" >&2
            echo "expected: $expected_fpr" >&2
            echo "actual:   $actual_fpr" >&2
            exit 1
          fi

          cat > /tmp/gpg-loopback <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -n "${WORKFLOW_GPG_PASSPHRASE:-}" ]; then
            exec gpg --batch --pinentry-mode loopback --passphrase "$WORKFLOW_GPG_PASSPHRASE" "$@"
          fi
          exec gpg --batch "$@"
          EOF
          chmod 700 /tmp/gpg-loopback

          git config user.signingkey "$key_fpr"
          git config commit.gpgsign true
          git config gpg.program /tmp/gpg-loopback

      - name: Open the PR
        if: steps.updater.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          branch="auto/nosdshell-v${ver}"
          existing=$(gh pr list --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #${existing} is already open for ${branch}."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -S -am "chore(desktop): bump nosdshell to ${ver}"
          git push -u origin "$branch"
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          nosDShell ${RELEASE_TAG} 已发布：https://github.com/ShineBreaker/nosDShell/releases/tag/${RELEASE_TAG}

          由 nosDShell 的 Release workflow 触发 \`update_versions.py --only nosdshell\` 生成，只改两处：

          - \`%nosdshell-version\` → \`${ver}\`
          - \`%nosdshell-source\` 的 \`base32\` → tag \`${RELEASE_TAG}\` 的检出 hash

          未 merge 前，定时更新（周二/四/六）如果先跑到，会直接在 main 上改同一处，这个 PR 随之作废。
          EOF
          gh pr create --head "$branch" \
            --title "chore(desktop): bump nosdshell to ${ver}" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Nothing to do
        if: steps.updater.outputs.changed == 'false'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "jeans already pins nosdshell to ${RELEASE_TAG} — no PR needed."
