name: Auto Update Packages

on:
  schedule:
    - cron: "0 2 * * 2,4,6"
  workflow_dispatch:

concurrency:
  group: auto-update

permissions:
  contents: write
  issues: write

env:
  FORGEJO_SERVER_URL: https://codeberg.org
  FORGEJO_REPOSITORY: BrokenShine/jeans

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        shell: bash
        run: pip install requests

      # ── Guix 环境准备（提前到 updater 之前，供 guix refresh 使用）──
      # 原先这些步骤受 has_changes 条件控制，因为只有 Python updater 产生
      # 变更后才需要 Guix 做构建测试。现在引入 guix refresh 作为主力 updater，
      # 它本身就需要 Guix，所以 Guix 安装必须提前、且无条件执行。

      - name: Prepare /etc/gitconfig for Guix sandbox
        shell: bash
        run: |
          # GitHub Actions runner 的 /etc/gitconfig 可能含 safe.directory 等条目
          # 且权限受限（非 world-readable）。Guix 构建沙箱内的 git init 会尝试
          # 读取它，若文件存在但不可读则返回 EACCES → git 退出 128。
          # GIT_CONFIG_NOSYSTEM 环境变量无法穿透 guix-daemon 的构建沙箱，因此
          # 必须从文件系统层面解决：在 daemon 启动前彻底移除该文件。
          # 如果文件不存在，git 会静默跳过（ENOENT），不影响构建。
          if [ -f /etc/gitconfig ]; then
            echo "Removing /etc/gitconfig before Guix daemon starts..."
            sudo rm -f /etc/gitconfig
          else
            echo "/etc/gitconfig does not exist, nothing to remove."
          fi

      - name: Install Guix
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://guix.gnu.org/install.sh -o /tmp/install-guix.sh
          { yes "" 2>/dev/null || true; } | sudo -E bash /tmp/install-guix.sh
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          guix pull --verbosity=0
          hash guix
          guix --version

      - name: Checkout nonguix channel
        shell: bash
        run: |
          git clone --depth=1 \
            https://gitlab.com/nonguix/nonguix.git \
            /tmp/nonguix

      # ── guix refresh（主力 updater）：改写 GitHub release 包 + git-fetch 包 ──
      # guix refresh 作为主力 updater 接管 GitHub release 包（需 upstream-name
      # property）和 git-fetch 有 tag 包。Python updater 随后只处理 guix 力所
      # 不及的少数派（zcode CDN、kimi-code npm tag、reasonix-desktop-bin 等）。
      # GUIX_GITHUB_TOKEN 是 guix refresh 读 GitHub API 的专属环境变量名
      # （不是 GITHUB_TOKEN），必须单独映射。

      - name: Run guix refresh
        id: refresh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi

          echo "=== guix refresh: GitHub release + git-fetch 包 ==="
          # 显式列出归 refresh 管的包（不用 -s module:jeans，避免误伤
          # librewolf-nongnu 等 inherit 包，也避免模块加载敏感问题）。
          # 不交给 refresh 的包：zcode（z.ai CDN）、font-misans（无 version URL）、
          # kimi-code-bin（npm scoped tag）、jdtls-bin（Eclipse + 日期戳）、
          # librewolf-nongnu（inherit）、reasonix-desktop-bin（desktop-v 前缀
          # URL 重建失败）——这些留给 Python updater。
          guix refresh -L modules -L /tmp/nonguix -u \
            crush-bin opencode-bin mimocode-bin orca-ide-bin oh-my-pi-bin \
            codewhale-bin reasonix-bin github-copilot \
            ellsp-bin eask-bin neomacs-bin motrix-next-bin cc-switch-bin \
            font-maple-font-nf-cn font-nerd-symbols font-nerd-font-iosevka \
            lr2oraja-endlessdream-bin osu-lazer-bin zen-browser-bin \
            emacs-ghostel emacs-msgu emacs-ellsp \
            colloid-gtk-theme vimix-gtk-themes vimix-kvantum-themes \
            nix-ld opentabletdriver-udev-rules waypaper \
            git-credential-keepassxc python-screeninfo \
            2>&1 | tee /tmp/refresh.log
          # guix refresh 对"无更新"返回 0，对个别包失败不阻塞整体；
          # 不用 set -e，让后续步骤继续。

      - name: Record refresh-changed packages
        shell: bash
        run: |
          # 从 git diff 提取 refresh 改动的包名，供构建测试合并使用
          scripts/check-updates/refresh-changed-packages.sh \
            > scripts/check-updates/refresh-updates.json
          echo "Refresh updated packages:"
          cat scripts/check-updates/refresh-updates.json

      # ── Python updater（兜底）：处理 guix refresh 力不能及的包 ──

      - name: Run auto-update script
        id: updater
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          env CI=true GITHUB_TOKEN="$GITHUB_TOKEN" \
            python3 scripts/check-updates/update_versions.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test updated packages
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_EXTRA_LOAD_PATH: /tmp/nonguix
          # 主防线：上一步 "Prepare /etc/gitconfig" 已在 daemon 启动前 rm -f 该文件。
          # GIT_CONFIG_NOSYSTEM 作为二级兜底（若将来 Guix 支持将 env 传入沙箱）。
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -euo pipefail
          # 三级兜底：若 /etc/gitconfig 在上一步之后被意外重建，再次尝试移除
          # 并设 world-readable（仅报告，不阻塞）。
          if [ -f /etc/gitconfig ]; then
            echo "WARNING: /etc/gitconfig reappeared — removing..."
            sudo rm -f /etc/gitconfig
          fi
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          python3 scripts/check-updates/test_updated_packages.py

      - name: Upload build report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-report
          path: scripts/check-updates/build-report.json
          if-no-files-found: warn

      - name: Configure GPG signing
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          WORKFLOW_GPG_PRIVATE_KEY: ${{ secrets.WORKFLOW_GPG_PRIVATE_KEY }}
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
          WORKFLOW_GPG_FINGERPRINT: ${{ vars.WORKFLOW_GPG_FINGERPRINT }}
          WORKFLOW_GIT_NAME: ${{ vars.WORKFLOW_GIT_NAME }}
          WORKFLOW_GIT_EMAIL: ${{ vars.WORKFLOW_GIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${WORKFLOW_GPG_PRIVATE_KEY:-}" ]; then
            echo "GitHub secret WORKFLOW_GPG_PRIVATE_KEY is required" >&2
            exit 1
          fi
          if [ -z "${WORKFLOW_GPG_FINGERPRINT:-}" ]; then
            echo "GitHub variable WORKFLOW_GPG_FINGERPRINT is required" >&2
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP:-/tmp}/jeans-workflow-gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"

          printf '%s\n' "$WORKFLOW_GPG_PRIVATE_KEY" | gpg --batch --import

          key_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$key_fpr" ]; then
            echo "Unable to determine imported signing key fingerprint" >&2
            exit 1
          fi
          expected_fpr="$(printf '%s' "$WORKFLOW_GPG_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual_fpr="$(printf '%s' "$key_fpr" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_fpr" != "$expected_fpr" ]; then
            echo "Imported GPG key fingerprint does not match WORKFLOW_GPG_FINGERPRINT" >&2
            echo "expected: $expected_fpr" >&2
            echo "actual:   $actual_fpr" >&2
            exit 1
          fi

          cat > /tmp/gpg-loopback <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -n "${WORKFLOW_GPG_PASSPHRASE:-}" ]; then
            exec gpg --batch --pinentry-mode loopback --passphrase "$WORKFLOW_GPG_PASSPHRASE" "$@"
          fi
          exec gpg --batch "$@"
          EOF
          chmod 700 /tmp/gpg-loopback

          git config user.name "${WORKFLOW_GIT_NAME:-jeans workflow bot}"
          git config user.email "${WORKFLOW_GIT_EMAIL:-102544159+ShineBreaker@users.noreply.github.com}"
          git config user.signingkey "$key_fpr"
          git config commit.gpgsign true
          git config gpg.program /tmp/gpg-loopback

      - name: Commit updates
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          git add modules/
          git commit -S -m "UPDATE: auto package update $(date -u +%Y-%m-%d)"

      - name: Push updates to GitHub
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Mirror updated branch to Codeberg
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_USERNAME: ${{ vars.FORGEJO_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "GitHub secret FORGEJO_TOKEN is required" >&2
            exit 1
          fi
          if [ -z "${FORGEJO_USERNAME:-}" ]; then
            echo "GitHub variable FORGEJO_USERNAME is required" >&2
            exit 1
          fi

          remote_url="https://${FORGEJO_USERNAME}:${FORGEJO_TOKEN}@${FORGEJO_SERVER_URL#https://}/${FORGEJO_REPOSITORY}.git"
          git remote add codeberg "$remote_url"
          git push --force codeberg "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Upload update report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-update-report
          path: scripts/check-updates/report.json
          if-no-files-found: warn
