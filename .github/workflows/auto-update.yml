name: Auto Update Packages

on:
  schedule:
    - cron: "0 2 * * 2,4,6"
  workflow_dispatch:
    inputs:
      test_packages:
        description: "逗号分隔的包名：跳过更新逻辑，仅构建测试这些包（留空走正常更新流程）"
        required: false
        default: ""
        type: string

concurrency:
  group: auto-update

permissions:
  contents: write
  issues: write

env:
  FORGEJO_SERVER_URL: https://codeberg.org
  FORGEJO_REPOSITORY: BrokenShine/jeans

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        shell: bash
        run: pip install requests

      - name: Test updater release tag prefixes
        shell: bash
        run: python3 scripts/check-updates/test_tag_prefix.py

      # ── Guix 环境准备（提前到 updater 之前，供 guix refresh 使用）──
      # 原先这些步骤受 has_changes 条件控制，因为只有 Python updater 产生
      # 变更后才需要 Guix 做构建测试。现在引入 guix refresh 作为主力 updater，
      # 它本身就需要 Guix，所以 Guix 安装必须提前、且无条件执行。

      - name: Prepare /etc/gitconfig for Guix sandbox
        shell: bash
        run: |
          # GitHub Actions runner 的 /etc/gitconfig 可能含 safe.directory 等条目
          # 且权限受限（非 world-readable）。Guix 构建沙箱内的 git init 会尝试
          # 读取它，若文件存在但不可读则返回 EACCES → git 退出 128。
          # GIT_CONFIG_NOSYSTEM 环境变量无法穿透 guix-daemon 的构建沙箱，因此
          # 必须从文件系统层面解决：在 daemon 启动前彻底移除该文件。
          # 如果文件不存在，git 会静默跳过（ENOENT），不影响构建。
          if [ -f /etc/gitconfig ]; then
            echo "Removing /etc/gitconfig before Guix daemon starts..."
            sudo rm -f /etc/gitconfig
          else
            echo "/etc/gitconfig does not exist, nothing to remove."
          fi

      - name: Compute Guix snapshot cache key
        id: guix-key
        shell: bash
        run: echo "key=guix-snapshot-v1-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # ── Guix 安装快照缓存：Install Guix（install.sh + guix pull）占整轮
      # run 约 30 分钟，是最大时间开销。每周一条快照（key 含 ISO 周号），
      # 命中则解包上次的 /gnu + /var/guix + guix-daemon 服务与用户配置，
      # 只做增量 pull；restore-keys 兜底命中上一周快照，增量稍大但可用。
      - name: Restore Guix installation snapshot
        id: guix-snapshot
        uses: actions/cache/restore@v4
        with:
          path: /tmp/guix-snapshot.tar.zst
          key: ${{ steps.guix-key.outputs.key }}
          restore-keys: guix-snapshot-v1-

      - name: Install Guix
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/guix-snapshot.tar.zst ]; then
            echo "Restoring Guix from snapshot..."
            # --numeric-owner 保留快照里的数字 uid/gid；guix-daemon 是
            # --system 动态分配 uid 的系统用户，各 runner 上不一致，恢复
            # 后必须按 store 属主的 uid/gid 重建同名用户，daemon 才有
            # 权限写 /gnu/store 与 /var/guix/db.sqlite。
            sudo tar --numeric-owner --zstd -xf /tmp/guix-snapshot.tar.zst -C /
            # install.sh 在 Ubuntu 上会开启 unprivileged userns 开关供
            # guix-daemon 使用，快照恢复路径需自行保证（键不存在则跳过）。
            # apparmor_restrict_unprivileged_userns=0 缺失时，daemon 沙箱
            # 无法配 loopback（initLoopback EPERM）、构建树 exec 报 EACCES。
            sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
              2>/dev/null || true
            # 快照不含 /var/log/guix（install.sh 建立并归属 daemon 用户）；
            # 缺失会让 guix pull 直接 Permission denied。
            sudo mkdir -p /var/log/guix
            sudo chown "$(stat -c %u /gnu/store):$(stat -c %g /gnu/store)" \
              /var/log/guix
            uid=$(stat -c %u /gnu/store)
            gid=$(stat -c %g /gnu/store)
            sudo groupadd -g "$gid" guix-daemon 2>/dev/null \
              || sudo groupmod -g "$gid" guix-daemon
            if id -u guix-daemon >/dev/null 2>&1; then
              sudo usermod -u "$uid" -g "$gid" guix-daemon
            else
              sudo useradd -g "$gid" -u "$uid" -d /var/empty \
                -s "$(command -v nologin)" --system guix-daemon
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable --now guix-daemon
          else
            # install.sh 硬编码 ftpmirror.gnu.org 下载（不可通过环境变量
            # 换源），该镜像偶发 502/不可达；此时退回 ftp.gnu.org 主站预
            # 下载 tarball，经 GUIX_BINARY_FILE_NAME 走本地安装分支
            # （TLS 保证来源完整性）。
            if ! curl -fsI --max-time 20 https://ftpmirror.gnu.org/gnu/guix/ >/dev/null 2>&1; then
              echo "ftpmirror.gnu.org unreachable, falling back to ftp.gnu.org"
              ver=$(curl -fsSL https://ftp.gnu.org/gnu/guix/ \
                | sed -n -e 's/.*guix-binary-\([0-9.]*[a-z0-9]*\)\.x86_64-linux\.tar\.xz.*/\1/p' \
                | sort -Vu | tail -1)
              echo "latest binary release: $ver"
              f="guix-binary-${ver}.x86_64-linux.tar.xz"
              curl -fSL -o "/tmp/$f" "https://ftp.gnu.org/gnu/guix/$f"
              export GUIX_BINARY_FILE_NAME="/tmp/$f"
            fi
            curl -fsSL https://guix.gnu.org/install.sh -o /tmp/install-guix.sh
            { yes "" 2>/dev/null || true; } | sudo -E bash /tmp/install-guix.sh
          fi
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          guix pull --verbosity=0
          hash guix
          guix --version

      - name: Point guix-daemon build trees at an exec-permitted fs
        shell: bash
        run: |
          # GitHub runner 的构建沙箱里，执行构建树内的可执行文件
          # （AppImage 自解压、autotools 的 ./configure）会 execvp EACCES
          # （issue #32）。根因：Guix 1.5 install.sh 默认安装 unprivileged
          # daemon（user namespace 沙箱），而 Ubuntu 23.10+ 默认
          # apparmor_restrict_unprivileged_userns=1，限制非特权 userns 的
          # mount 操作，导致沙箱内构建树挂载异常。解除该限制（非 Ubuntu
          # 无此键，容错跳过）。
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "sysctl unavailable, continuing"
          sudo mkdir -p /etc/systemd/system/guix-daemon.service.d
          printf '[Service]\nEnvironment=TMPDIR=/var/tmp\n' \
            | sudo tee /etc/systemd/system/guix-daemon.service.d/build-dir.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon
          systemctl show guix-daemon -p Environment

          # 诊断：实锤两个候选路径的 exec 能力，供日志对照。
          for d in /tmp /var/tmp; do
            echo "== $d =="
            findmnt -T "$d" -o TARGET,SOURCE,FSTYPE,OPTIONS || true
            probe="$d/.guix-exec-probe"
            cp /bin/true "$probe"
            if "$probe" 2>/dev/null; then echo "exec: OK"; else echo "exec: DENIED"; fi
            rm -f "$probe"
          done

      - name: Checkout nonguix channel
        shell: bash
        run: |
          git clone --depth=1 \
            https://gitlab.com/nonguix/nonguix.git \
            /tmp/nonguix

      # ── guix refresh（主力 updater）：改写 GitHub release 包 + git-fetch 包 ──
      # guix refresh 作为主力 updater 接管 GitHub release 包（需 upstream-name
      # property）和 git-fetch 有 tag 包。Python updater 随后只处理 guix 力所
      # 不及的少数派（zcode CDN、kimi-code npm tag、reasonix-desktop-bin 等）。
      # GUIX_GITHUB_TOKEN 是 guix refresh 读 GitHub API 的专属环境变量名
      # （不是 GITHUB_TOKEN），必须单独映射。

      - name: Run guix refresh
        id: refresh
        if: inputs.test_packages == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi

          echo "=== guix refresh: GitHub release + git-fetch 包 ==="
          # 显式列出归 refresh 管的包（不用 -s module:jeans，避免误伤
          # librewolf-nongnu 等 inherit 包，也避免模块加载敏感问题）。
          # 不交给 refresh 的包：zcode（z.ai CDN 官网 JS 版本列表）、
          # font-misans（zip 无版本号，ETag 信号）、amber-pm（gitee 追踪
          # master）、jdtls-bin（Eclipse 目录页 + 日期戳）、
          # librewolf-nongnu（inherit）、reasonix-desktop-bin（desktop-v
          # 前缀 URL 重建失败）——这些交给 Python updater 的特殊源处理器。
          # git-credential-keepassxc 也暂不交 refresh：0.14.3 的 sysinfo-0.39.1
          # 需要 rustc >= 1.95，Guix 上游尚未打包 rust-1.95，升级后会卡死
          # build-test；先固定 0.14.2，等 Guix 有了 rust-1.95 再恢复。
          guix refresh -L modules -L /tmp/nonguix -u \
            crush-bin opencode-desktop-bin herdr-bin \
            codewhale-bin reasonix-bin github-copilot \
            ellsp-bin eask-bin neomacs-bin motrix-next-bin cc-switch-bin \
            font-maple-font-nf-cn font-nerd-symbols font-nerd-font-iosevka \
            lr2oraja-endlessdream-bin osu-lazer-bin inso-bin zen-browser-bin \
            emacs-ghostel emacs-msgu emacs-ellsp \
            colloid-gtk-theme vimix-gtk-themes vimix-kvantum-themes \
            nix-ld opentabletdriver-udev-rules waypaper \
            2>&1 | tee /tmp/refresh.log
          # guix refresh 对"无更新"返回 0，对个别包失败不阻塞整体；
          # 不用 set -e，让后续步骤继续。

      - name: Record refresh-changed packages
        if: inputs.test_packages == ''
        shell: bash
        run: |
          # 从 git diff 提取 refresh 改动的包名，供构建测试合并使用
          scripts/check-updates/refresh-changed-packages.sh \
            > scripts/check-updates/refresh-updates.json
          echo "Refresh updated packages:"
          cat scripts/check-updates/refresh-updates.json

      # ── Python updater（兜底）：处理 guix refresh 力不能及的包 ──
      # 特殊源处理器：zcode（z.ai CDN 官网 JS 版本列表）、amber-pm（gitee
      # API 追踪 master）、jdtls-bin（GitHub tags + Eclipse 目录页）、
      # font-misans（zip 无版本号，ETag/Last-Modified 信号）。
      # stale 监控：librewolf-nongnu / git-credential-keepassxc 无法自动更新，
      # 超 14 天无手动更新则发提醒 issue。

      - name: Run auto-update script
        id: updater
        if: inputs.test_packages == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          env CI=true GITHUB_TOKEN="$GITHUB_TOKEN" \
            python3 scripts/check-updates/update_versions.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          # 除已跟踪文件的 diff 外，还要检查未跟踪的 state 文件（首轮创建的
          # font-misans-state.json / stale-state.json）。git diff --quiet 不含
          # 未跟踪文件，不检查的话它们永远不会入库，下轮 CI 又从头开始。
          untracked_state=""
          for f in scripts/check-updates/font-misans-state.json \
                   scripts/check-updates/stale-state.json; do
            [ -f "$f" ] && [ -z "$(git ls-files -- "$f")" ] && untracked_state="$f"
          done
          if git diff --quiet && [ -z "$untracked_state" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test updated packages
        # 手动模式（test_packages 非空）下也执行：此时更新步骤全部跳过，
        # 工作区干净，仅按参数构建指定包，不会产生提交。
        if: steps.changes.outputs.has_changes == 'true' || inputs.test_packages != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_EXTRA_LOAD_PATH: /tmp/nonguix
          TEST_PACKAGES: ${{ inputs.test_packages }}
          # 主防线：上一步 "Prepare /etc/gitconfig" 已在 daemon 启动前 rm -f 该文件。
          # GIT_CONFIG_NOSYSTEM 作为二级兜底（若将来 Guix 支持将 env 传入沙箱）。
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -euo pipefail
          # 三级兜底：若 /etc/gitconfig 在上一步之后被意外重建，再次尝试移除
          # 并设 world-readable（仅报告，不阻塞）。
          if [ -f /etc/gitconfig ]; then
            echo "WARNING: /etc/gitconfig reappeared — removing..."
            sudo rm -f /etc/gitconfig
          fi
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          if [ -n "${TEST_PACKAGES:-}" ]; then
            # 沙箱内 exec 探针：打印构建沙箱的挂载 flags 并尝试执行
            # 构建树内脚本（issue #32 的失败操作），只输出诊断不阻断。
            guix build -f scripts/check-updates/exec-probe.scm || true
            python3 scripts/check-updates/test_updated_packages.py \
              --packages "$TEST_PACKAGES"
          else
            python3 scripts/check-updates/test_updated_packages.py
          fi

      - name: Upload build report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-report
          path: scripts/check-updates/build-report.json
          if-no-files-found: warn

      - name: Configure GPG signing
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          WORKFLOW_GPG_PRIVATE_KEY: ${{ secrets.WORKFLOW_GPG_PRIVATE_KEY }}
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
          WORKFLOW_GPG_FINGERPRINT: ${{ vars.WORKFLOW_GPG_FINGERPRINT }}
          WORKFLOW_GIT_NAME: ${{ vars.WORKFLOW_GIT_NAME }}
          WORKFLOW_GIT_EMAIL: ${{ vars.WORKFLOW_GIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${WORKFLOW_GPG_PRIVATE_KEY:-}" ]; then
            echo "GitHub secret WORKFLOW_GPG_PRIVATE_KEY is required" >&2
            exit 1
          fi
          if [ -z "${WORKFLOW_GPG_FINGERPRINT:-}" ]; then
            echo "GitHub variable WORKFLOW_GPG_FINGERPRINT is required" >&2
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP:-/tmp}/jeans-workflow-gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"

          printf '%s\n' "$WORKFLOW_GPG_PRIVATE_KEY" | gpg --batch --import

          key_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$key_fpr" ]; then
            echo "Unable to determine imported signing key fingerprint" >&2
            exit 1
          fi
          expected_fpr="$(printf '%s' "$WORKFLOW_GPG_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual_fpr="$(printf '%s' "$key_fpr" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_fpr" != "$expected_fpr" ]; then
            echo "Imported GPG key fingerprint does not match WORKFLOW_GPG_FINGERPRINT" >&2
            echo "expected: $expected_fpr" >&2
            echo "actual:   $actual_fpr" >&2
            exit 1
          fi

          cat > /tmp/gpg-loopback <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -n "${WORKFLOW_GPG_PASSPHRASE:-}" ]; then
            exec gpg --batch --pinentry-mode loopback --passphrase "$WORKFLOW_GPG_PASSPHRASE" "$@"
          fi
          exec gpg --batch "$@"
          EOF
          chmod 700 /tmp/gpg-loopback

          git config user.name "${WORKFLOW_GIT_NAME:-jeans workflow bot}"
          git config user.email "${WORKFLOW_GIT_EMAIL:-102544159+ShineBreaker@users.noreply.github.com}"
          git config user.signingkey "$key_fpr"
          git config commit.gpgsign true
          git config gpg.program /tmp/gpg-loopback

      - name: Commit updates
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          git add modules/
          # 状态文件必须入库：font-misans-state.json 是 MiSans ETag 基线，
          # stale-state.json 是提醒周期记忆。不提交则 CI 每次都是全新状态，
          # stale 提醒永不触发、且会无限触发 has_changes。
          for f in scripts/check-updates/font-misans-state.json \
                   scripts/check-updates/stale-state.json; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -S -m "feat(packages): auto package update $(date -u +%Y-%m-%d)"

      - name: Push updates to GitHub
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Mirror updated branch to Codeberg
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_USERNAME: ${{ vars.FORGEJO_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "GitHub secret FORGEJO_TOKEN is required" >&2
            exit 1
          fi
          if [ -z "${FORGEJO_USERNAME:-}" ]; then
            echo "GitHub variable FORGEJO_USERNAME is required" >&2
            exit 1
          fi

          remote_url="https://${FORGEJO_USERNAME}:${FORGEJO_TOKEN}@${FORGEJO_SERVER_URL#https://}/${FORGEJO_REPOSITORY}.git"
          git remote add codeberg "$remote_url"
          git push --force codeberg "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Snapshot Guix installation for next run
        # 仅在本次未命中快照（每周第一条）时打包；daemon 必须先停，保证
        # /var/guix/db.sqlite 与 /gnu/store 文件状态一致。always()：构建
        # 失败不影响 store 状态，快照依然有效。
        if: always() && steps.guix-snapshot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop guix-daemon
          args=(/gnu /var/guix)
          [ -d /etc/guix ] && args+=(/etc/guix) || true
          [ -f /etc/systemd/system/guix-daemon.service ] \
            && args+=(/etc/systemd/system/guix-daemon.service) || true
          [ -d "$HOME/.config/guix" ] && args+=("$HOME/.config/guix") || true
          sudo tar --numeric-owner --use-compress-program='zstd -T0 -3' \
            -cf /tmp/guix-snapshot.tar.zst "${args[@]}"
          ls -lh /tmp/guix-snapshot.tar.zst

      - name: Save Guix installation snapshot
        if: always() && steps.guix-snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/guix-snapshot.tar.zst
          key: ${{ steps.guix-key.outputs.key }}

      - name: Upload update report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-update-report
          path: scripts/check-updates/report.json
          if-no-files-found: warn
