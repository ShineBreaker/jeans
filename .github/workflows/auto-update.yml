name: Auto Update Packages

on:
  schedule:
    - cron: "0 2 * * 2,4,6"
  workflow_dispatch:
    inputs:
      test_packages:
        description: "逗号分隔的包名：跳过更新逻辑，仅构建测试这些包（留空走正常更新流程）"
        required: false
        default: ""
        type: string

concurrency:
  group: auto-update

permissions:
  contents: write
  issues: write

env:
  FORGEJO_SERVER_URL: https://codeberg.org
  FORGEJO_REPOSITORY: BrokenShine/jeans
  # guix refresh 从 2026-11-28 起改跑**全通道黑名单**：默认每个包都试，
  # 只有 scripts/check-updates/config.json 的 refresh_exclude（每条带理由）
  # 才跳过。白名单那种"逐个列出包名"的写法已删除——它的失效方式是静默的：
  # 新包忘了登记就永远收不到 refresh 更新且不报错。
  # 安全闸在 scripts/check-updates/refresh_all.py 的守卫（先 dry-run 后写盘，
  # G1 版本不以数字开头 / G2 正式版被推到 pre-release / G3 降级 / G4 未变），
  # 再加构建闸门逐个 guix build。

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        shell: bash
        run: pip install requests

      - name: Test updater release tag prefixes
        shell: bash
        run: python3 scripts/check-updates/tests/test_tag_prefix.py

      - name: Test gh single/double-arch handler
        shell: bash
        run: python3 scripts/check-updates/tests/test_gh.py

      - name: Test gitlab tags handler
        shell: bash
        run: python3 scripts/check-updates/tests/test_gitlab_tags.py

      - name: Test conda-forge handler
        shell: bash
        run: python3 scripts/check-updates/tests/test_conda_bin.py

      - name: Test updater shared-variable sources
        shell: bash
        run: python3 scripts/check-updates/tests/test_shared_source.py

      - name: Test updater release candidate guard
        shell: bash
        run: python3 scripts/check-updates/tests/test_release_candidate.py

      - name: Test refresh blacklist driver
        shell: bash
        run: python3 scripts/check-updates/tests/test_refresh_all.py

      - name: Test updater package-failure exit code
        shell: bash
        run: python3 scripts/check-updates/tests/test_package_failure_exit.py

      - name: Test updater package-failure handling end to end
        shell: bash
        run: python3 scripts/check-updates/tests/test_package_failure_e2e.py

      - name: Test workbuddy-cn update decisions
        shell: bash
        run: python3 scripts/check-updates/tests/test_workbuddy_cn.py

      - name: Test qoder-cn update decisions
        shell: bash
        run: python3 scripts/check-updates/tests/test_qoder_cn.py

      # ── Guix 环境准备（提前到 updater 之前，供 guix refresh 使用）──
      # 原先这些步骤受 has_changes 条件控制，因为只有 Python updater 产生
      # 变更后才需要 Guix 做构建测试。现在引入 guix refresh 作为主力 updater，
      # 它本身就需要 Guix，所以 Guix 安装必须提前、且无条件执行。

      - name: Prepare /etc/gitconfig for Guix sandbox
        shell: bash
        run: |
          # GitHub Actions runner 的 /etc/gitconfig 可能含 safe.directory 等条目
          # 且权限受限（非 world-readable）。Guix 构建沙箱内的 git init 会尝试
          # 读取它，若文件存在但不可读则返回 EACCES → git 退出 128。
          # GIT_CONFIG_NOSYSTEM 环境变量无法穿透 guix-daemon 的构建沙箱，因此
          # 必须从文件系统层面解决：在 daemon 启动前彻底移除该文件。
          # 如果文件不存在，git 会静默跳过（ENOENT），不影响构建。
          if [ -f /etc/gitconfig ]; then
            echo "Removing /etc/gitconfig before Guix daemon starts..."
            sudo rm -f /etc/gitconfig
          else
            echo "/etc/gitconfig does not exist, nothing to remove."
          fi

      - name: Compute Guix snapshot cache key
        id: guix-key
        shell: bash
        run: echo "key=guix-snapshot-v1-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # issue #32 根因：Guix 1.5 起在 systemd 发行版安装 unprivileged
      # daemon（user namespace 沙箱），Ubuntu 23.10+ 默认
      # apparmor_restrict_unprivileged_userns=1，daemon 沙箱内构建树 exec
      # 与 /proc 读取一律 EACCES（AppImage 自解压、autotools ./configure
      # 全部死于此）。该 sysctl 必须在任何 guix-daemon 启动之前生效——
      # daemon 进程继承启动瞬间的 LSM 状态，事后设置无效。
      - name: Lift Ubuntu userns restrictions before daemon start
        shell: bash
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null \
            || echo "sysctl unavailable (non-Debian), continuing"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            2>/dev/null || echo "sysctl unavailable, continuing"

      # ── Guix 安装快照缓存：Install Guix（install.sh + guix pull）占整轮
      # run 约 30 分钟，是最大时间开销。每周一条快照（key 含 ISO 周号），
      # 命中则解包上次的 /gnu + /var/guix + guix-daemon 服务与用户配置，
      # 只做增量 pull；restore-keys 兜底命中上一周快照，增量稍大但可用。
      - name: Restore Guix installation snapshot
        id: guix-snapshot
        uses: actions/cache/restore@v4
        with:
          path: /tmp/guix-snapshot.tar.zst
          key: ${{ steps.guix-key.outputs.key }}
          restore-keys: guix-snapshot-v1-

      - name: Install Guix
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/guix-snapshot.tar.zst ]; then
            echo "Restoring Guix from snapshot..."
            # --numeric-owner 保留快照里的数字 uid/gid；guix-daemon 是
            # --system 动态分配 uid 的系统用户，各 runner 上不一致，恢复
            # 后必须按 store 属主的 uid/gid 重建同名用户，daemon 才有
            # 权限写 /gnu/store 与 /var/guix/db.sqlite。
            sudo tar --numeric-owner --zstd -xf /tmp/guix-snapshot.tar.zst -C /
            # 快照不含 /var/log/guix（install.sh 建立并归属 daemon 用户）；
            # 缺失会让 guix pull 直接 Permission denied。
            sudo mkdir -p /var/log/guix
            sudo chown "$(stat -c %u /gnu/store):$(stat -c %g /gnu/store)" \
              /var/log/guix
            uid=$(stat -c %u /gnu/store)
            gid=$(stat -c %g /gnu/store)
            # 快照里的 gid 是保存时 runner 上动态分配的数字，恢复时可能已被
            # 别的系统组占用：此时 groupadd 失败，而 groupmod 因 guix-daemon
            # 组尚不存在也失败（exit 6，2026-11-10 实证）。所以先按数字查
            # 现有组——占用该 gid 的组直接拿来当 daemon 主组，没有才新建。
            # usermod/useradd 的 -g 传数字时要求 GID 已存在，统一用组名。
            group_name=$(awk -F: -v g="$gid" '$3==g {print $1; exit}' /etc/group)
            if [ -z "$group_name" ]; then
              sudo groupadd -g "$gid" guix-daemon
              group_name=guix-daemon
            fi
            if id -u guix-daemon >/dev/null 2>&1; then
              sudo usermod -u "$uid" -g "$group_name" guix-daemon
            else
              sudo useradd -g "$group_name" -u "$uid" -d /var/empty \
                -s "$(command -v nologin)" --system guix-daemon
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable --now guix-daemon
          else
            # install.sh 硬编码 ftpmirror.gnu.org 下载（不可通过环境变量
            # 换源），该镜像偶发 502/不可达；此时退回 ftp.gnu.org 主站预
            # 下载 tarball，经 GUIX_BINARY_FILE_NAME 走本地安装分支
            # （TLS 保证来源完整性）。
            if ! curl -fsI --max-time 20 https://ftpmirror.gnu.org/gnu/guix/ >/dev/null 2>&1; then
              echo "ftpmirror.gnu.org unreachable, falling back to ftp.gnu.org"
              ver=$(curl -fsSL https://ftp.gnu.org/gnu/guix/ \
                | sed -n -e 's/.*guix-binary-\([0-9.]*[a-z0-9]*\)\.x86_64-linux\.tar\.xz.*/\1/p' \
                | sort -Vu | tail -1)
              echo "latest binary release: $ver"
              f="guix-binary-${ver}.x86_64-linux.tar.xz"
              curl -fSL -o "/tmp/$f" "https://ftp.gnu.org/gnu/guix/$f"
              export GUIX_BINARY_FILE_NAME="/tmp/$f"
            fi
            curl -fsSL https://guix.gnu.org/install.sh -o /tmp/install-guix.sh
            { yes "" 2>/dev/null || true; } | sudo -E bash /tmp/install-guix.sh
          fi
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          guix pull --verbosity=0
          hash guix
          guix --version

      - name: Checkout nonguix channel
        shell: bash
        run: |
          git clone --depth=1 \
            https://gitlab.com/nonguix/nonguix.git \
            /tmp/nonguix

      # ── guix refresh（黑名单 + 守卫）：默认跑全通道 ─────────────────
      # 先枚举本通道的包（定义位置落在 modules/ 下），再用 refresh_all.py
      # 分块跑 dry-run（guix refresh 默认只报告不改写）、过守卫、只对放行的
      # 包执行 -u。刷新失败/被守卫拦下的包仍由 Python 兜底 updater 处理，
      # 它本来就是全量黑名单模型。
      # GUIX_GITHUB_TOKEN 是 guix refresh 读 GitHub API 的专属变量名
      # （不是 GITHUB_TOKEN），必须单独映射。

      - name: List channel packages for refresh
        if: inputs.test_packages == ''
        shell: bash
        run: |
          set -uo pipefail
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          # 只取定义位置在本仓库 modules/ 下的包；rust-crates 的 crate-source
          # 不是 package，自然不会出现在 -A 里。
          guix package -L modules -L /tmp/nonguix -A 2>/dev/null \
            | awk -F'\t' '$4 ~ /(^|\/)modules\/jeans\// {print $1}' \
            | sort -u > /tmp/channel-packages.txt
          count=$(wc -l < /tmp/channel-packages.txt)
          echo "通道包数：$count"
          # 枚举失败（模块加载报错、-L 写错）会让后面的 refresh 静默空跑，
          # 这里直接拦住：正常情况下本通道有 140+ 个包。
          if [ "$count" -lt 100 ]; then
            echo "::error::通道包枚举异常（$count 个），检查 -L 与模块加载"
            exit 1
          fi

      - name: Plan guix refresh (blacklist + guard)
        id: refresh-plan
        if: inputs.test_packages == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          python3 scripts/check-updates/refresh_all.py --plan \
            --load-path "$GITHUB_WORKSPACE/modules" \
            --load-path /tmp/nonguix \
            --packages /tmp/channel-packages.txt \
            --accepted /tmp/refresh-accepted.txt \
            --report /tmp/refresh-plan.json
          echo "--- 守卫放行的包 ---"
          cat /tmp/refresh-accepted.txt

      - name: Run guix refresh
        id: refresh
        if: inputs.test_packages == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          echo "=== guix refresh: 守卫放行的包 ==="
          # -L 必须是绝对路径：refresh -u 靠 package-field-location 定位并改写
          # 包源文件，相对 load path 下静默零改写还退出 0（2026-09-27 前的 CI
          # 就处在这个状态）。分块与重试都在脚本里（单个上游 TLS 抖动会打断
          # 整轮 guix refresh，本机 2026-11-28 实测死在 zellij-bin）。
          python3 scripts/check-updates/refresh_all.py --apply \
            --load-path "$GITHUB_WORKSPACE/modules" \
            --load-path /tmp/nonguix \
            --accepted /tmp/refresh-accepted.txt \
            2>&1 | tee /tmp/refresh.log
          echo "apply 结束（失败包已记录，交由 Python 兜底与构建闸门）"

      - name: Record refresh-changed packages
        if: inputs.test_packages == ''
        shell: bash
        run: |
          # 从 git diff 提取 refresh 改动的包名，供构建测试合并使用
          scripts/check-updates/refresh-changed-packages.sh \
            > scripts/check-updates/refresh-updates.json
          echo "Refresh updated packages:"
          cat scripts/check-updates/refresh-updates.json

      # ── Python updater（兜底）：处理 guix refresh 力不能及的包 ──
      # 特殊源处理器：zcode（z.ai CDN 官网 JS 版本列表）、amber-pm（gitee
      # API 追踪 master）、jdtls-bin（GitHub tags + Eclipse 目录页）、
      # font-misans（zip 无版本号，ETag/Last-Modified 信号）、
      # workbuddy-cn（腾讯更新通道的 version.json，同版本换字节也重钉）、
      # qoder-cn（阿里 OSS 上的 electron-builder generic 清单，latest/ 目录
      # 会被原地覆盖，只认 releases/<version>/ 固定资产）。
      # stale 监控：librewolf-nongnu / git-credential-keepassxc 无法自动更新，
      # 超 14 天无手动更新则发提醒 issue。

      - name: Run auto-update script
        id: updater
        if: inputs.test_packages == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          env CI=true GITHUB_TOKEN="$GITHUB_TOKEN" \
            python3 scripts/check-updates/update_versions.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          # 退出码：0=无更新，1=有更新，>1=脚本级错误。
          # 单个包检查失败不影响退出码（失败详情进 issue，成功包的更新照常
          # 写盘），所以这里只有真正的脚本错误才中止流水线——否则后面的
          # Detect changes / Build test / Commit 会被整体跳过，一包失败就
          # 挡住整批更新（2026-10-22 issue #59）。
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          # 除已跟踪文件的 diff 外，还要检查未跟踪的 state 文件（首轮创建的
          # font-misans-state.json / stale-state.json）。git diff --quiet 不含
          # 未跟踪文件，不检查的话它们永远不会入库，下轮 CI 又从头开始。
          untracked_state=""
          for f in scripts/check-updates/font-misans-state.json \
                   scripts/check-updates/stale-state.json; do
            [ -f "$f" ] && [ -z "$(git ls-files -- "$f")" ] && untracked_state="$f"
          done
          if git diff --quiet && [ -z "$untracked_state" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit test ELF dependency checker
        shell: bash
        run: python3 scripts/check-updates/tests/test_elf_deps.py

      - name: Build test updated packages
        # 手动模式（test_packages 非空）下也执行：此时更新步骤全部跳过，
        # 工作区干净，仅按参数构建指定包，不会产生提交。
        # continue-on-error：单包构建失败不阻断后续步骤——Recover 步骤
        # 会剔除失败包、重放其余包的更新照常提交（打破 all-or-nothing，
        # 2026-10-13/14 两次实证：一次瞬时 DNS 故障丢弃全部 19 个更新）。
        # run 的最终红绿由末尾 "Fail run" 步骤统一裁决。
        id: buildtest
        if: steps.changes.outputs.has_changes == 'true' || inputs.test_packages != ''
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_EXTRA_LOAD_PATH: /tmp/nonguix
          TEST_PACKAGES: ${{ inputs.test_packages }}
          # 主防线：上一步 "Prepare /etc/gitconfig" 已在 daemon 启动前 rm -f 该文件。
          # GIT_CONFIG_NOSYSTEM 作为二级兜底（若将来 Guix 支持将 env 传入沙箱）。
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -euo pipefail
          # 三级兜底：若 /etc/gitconfig 在上一步之后被意外重建，再次尝试移除
          # 并设 world-readable（仅报告，不阻塞）。
          if [ -f /etc/gitconfig ]; then
            echo "WARNING: /etc/gitconfig reappeared — removing..."
            sudo rm -f /etc/gitconfig
          fi
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          if [ -n "${TEST_PACKAGES:-}" ]; then
            python3 scripts/check-updates/tests/test_updated_packages.py \
              --packages "$TEST_PACKAGES"
          else
            python3 scripts/check-updates/tests/test_updated_packages.py
          fi

      - name: Upload build report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-report
          path: scripts/check-updates/build-report.json
          if-no-files-found: warn

      - name: Recover successful updates
        # build-test 有失败时：剔除构建失败的包，重放其余包的更新并照常
        # 提交——失败包保持 HEAD 版本（详情已在 issue 与 build-report
        # artifact 里），不再阻塞整批更新。重放确定性成立：refresh -u 与
        # Python updater 对已是最新版本的包都是 no-op，成功包子集重放
        # 产出的 version/base32 与首轮一致（guix 哈希固定）。
        id: recover
        if: steps.buildtest.outcome == 'failure' && inputs.test_packages == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi

          report=scripts/check-updates/build-report.json
          failed_list=$(python3 -c "
          import json
          r = json.load(open('$report'))
          print(' '.join(p['name'] for p in r['packages'] if not p.get('success')))")
          ok_list=$(python3 -c "
          import json
          r = json.load(open('$report'))
          print(','.join(p['name'] for p in r['packages'] if p.get('success')))")

          # 回滚范围仅 modules/jeans/packages/：CI 是干净 checkout，该目录
          # 下全部未提交改动都是本 run 的 updater/refresh 产物，可由下方
          # 重放确定性重建；state 文件（font-misans 等）不在其列，保留。
          git checkout -- modules/jeans/packages/

          if [ -z "$ok_list" ]; then
            echo "全部包构建失败（$failed_list），无可恢复更新"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "剔除失败包: $failed_list"
          echo "重放成功包: ${ok_list//,/ }"

          # 回滚后重放：refresh 名单里构建成功的包走 apply（--only 取交集），
          # 其余交给 Python updater 的 --only（已到最新的包自然 no-op）。
          python3 scripts/check-updates/refresh_all.py --apply \
            --load-path "$GITHUB_WORKSPACE/modules" \
            --load-path /tmp/nonguix \
            --accepted /tmp/refresh-accepted.txt \
            --only "$ok_list" || true

          rc=0
          env CI=true GITHUB_TOKEN="$GITHUB_TOKEN" \
            python3 scripts/check-updates/update_versions.py --only "$ok_list" \
            || rc=$?
          # updater 退出码：0=无更新 1=已应用更新，>1 才是错误
          [ "$rc" -le 1 ] || exit "$rc"

          if git diff --quiet; then
            echo "⚠️ 重放后无改动，无可提交内容"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ 已恢复成功包的更新"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GPG signing
        # 正常路径（build-test 通过且首轮检出有改动），或 Recover 路径
        # （build-test 失败但成功包已重放恢复）。手动模式不产生提交。
        if: inputs.test_packages == '' && ((steps.buildtest.outcome != 'failure' && steps.changes.outputs.has_changes == 'true') || steps.recover.outputs.has_changes == 'true')
        shell: bash
        env:
          WORKFLOW_GPG_PRIVATE_KEY: ${{ secrets.WORKFLOW_GPG_PRIVATE_KEY }}
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
          WORKFLOW_GPG_FINGERPRINT: ${{ vars.WORKFLOW_GPG_FINGERPRINT }}
          WORKFLOW_GIT_NAME: ${{ vars.WORKFLOW_GIT_NAME }}
          WORKFLOW_GIT_EMAIL: ${{ vars.WORKFLOW_GIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${WORKFLOW_GPG_PRIVATE_KEY:-}" ]; then
            echo "GitHub secret WORKFLOW_GPG_PRIVATE_KEY is required" >&2
            exit 1
          fi
          if [ -z "${WORKFLOW_GPG_FINGERPRINT:-}" ]; then
            echo "GitHub variable WORKFLOW_GPG_FINGERPRINT is required" >&2
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP:-/tmp}/jeans-workflow-gnupg"
          rm -rf "$GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"

          printf '%s\n' "$WORKFLOW_GPG_PRIVATE_KEY" | gpg --batch --import

          key_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$key_fpr" ]; then
            echo "Unable to determine imported signing key fingerprint" >&2
            exit 1
          fi
          expected_fpr="$(printf '%s' "$WORKFLOW_GPG_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual_fpr="$(printf '%s' "$key_fpr" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_fpr" != "$expected_fpr" ]; then
            echo "Imported GPG key fingerprint does not match WORKFLOW_GPG_FINGERPRINT" >&2
            echo "expected: $expected_fpr" >&2
            echo "actual:   $actual_fpr" >&2
            exit 1
          fi

          cat > /tmp/gpg-loopback <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -n "${WORKFLOW_GPG_PASSPHRASE:-}" ]; then
            exec gpg --batch --pinentry-mode loopback --passphrase "$WORKFLOW_GPG_PASSPHRASE" "$@"
          fi
          exec gpg --batch "$@"
          EOF
          chmod 700 /tmp/gpg-loopback

          git config user.name "${WORKFLOW_GIT_NAME:-jeans workflow bot}"
          git config user.email "${WORKFLOW_GIT_EMAIL:-102544159+ShineBreaker@users.noreply.github.com}"
          git config user.signingkey "$key_fpr"
          git config commit.gpgsign true
          git config gpg.program /tmp/gpg-loopback

      - name: Commit updates
        # 正常路径（build-test 通过且首轮检出有改动），或 Recover 路径
        # （build-test 失败但成功包已重放恢复）。手动模式不产生提交。
        if: inputs.test_packages == '' && ((steps.buildtest.outcome != 'failure' && steps.changes.outputs.has_changes == 'true') || steps.recover.outputs.has_changes == 'true')
        shell: bash
        env:
          WORKFLOW_GPG_PASSPHRASE: ${{ secrets.WORKFLOW_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          git add modules/
          # 状态文件必须入库：font-misans-state.json 是 MiSans ETag 基线，
          # stale-state.json 是提醒周期记忆。不提交则 CI 每次都是全新状态，
          # stale 提醒永不触发、且会无限触发 has_changes。
          for f in scripts/check-updates/font-misans-state.json \
                   scripts/check-updates/stale-state.json; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -S -m "feat(packages): auto package update $(date -u +%Y-%m-%d)"

      - name: Push updates to GitHub
        # 正常路径（build-test 通过且首轮检出有改动），或 Recover 路径
        # （build-test 失败但成功包已重放恢复）。手动模式不产生提交。
        if: inputs.test_packages == '' && ((steps.buildtest.outcome != 'failure' && steps.changes.outputs.has_changes == 'true') || steps.recover.outputs.has_changes == 'true')
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Mirror updated branch to Codeberg
        # 正常路径（build-test 通过且首轮检出有改动），或 Recover 路径
        # （build-test 失败但成功包已重放恢复）。手动模式不产生提交。
        if: inputs.test_packages == '' && ((steps.buildtest.outcome != 'failure' && steps.changes.outputs.has_changes == 'true') || steps.recover.outputs.has_changes == 'true')
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_USERNAME: ${{ vars.FORGEJO_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "GitHub secret FORGEJO_TOKEN is required" >&2
            exit 1
          fi
          if [ -z "${FORGEJO_USERNAME:-}" ]; then
            echo "GitHub variable FORGEJO_USERNAME is required" >&2
            exit 1
          fi

          remote_url="https://${FORGEJO_USERNAME}:${FORGEJO_TOKEN}@${FORGEJO_SERVER_URL#https://}/${FORGEJO_REPOSITORY}.git"
          git remote add codeberg "$remote_url"
          git push --force codeberg "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Fail run on unresolved build failures
        # build-test 的失败被 continue-on-error 放行以提交成功包；此步骤
        # 在提交/镜像之后统一把 run 标红，确保失败对人工可见（issue 与
        # build-report artifact 已先行记录详情）。
        if: always() && steps.buildtest.outcome == 'failure'
        shell: bash
        run: |
          echo "❌ 构建测试仍有失败包（详见 issue 与 build-report artifact）；成功包更新已提交。"
          exit 1

      - name: Snapshot Guix installation for next run
        # 仅在本次未命中快照（每周第一条）时打包；daemon 必须先停，保证
        # /var/guix/db.sqlite 与 /gnu/store 文件状态一致。always()：构建
        # 失败不影响 store 状态，快照依然有效。
        if: always() && steps.guix-snapshot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop guix-daemon
          args=(/gnu /var/guix)
          [ -d /etc/guix ] && args+=(/etc/guix) || true
          [ -f /etc/systemd/system/guix-daemon.service ] \
            && args+=(/etc/systemd/system/guix-daemon.service) || true
          [ -d "$HOME/.config/guix" ] && args+=("$HOME/.config/guix") || true
          sudo tar --numeric-owner --use-compress-program='zstd -T0 -3' \
            -cf /tmp/guix-snapshot.tar.zst "${args[@]}"
          ls -lh /tmp/guix-snapshot.tar.zst

      - name: Save Guix installation snapshot
        if: always() && steps.guix-snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/guix-snapshot.tar.zst
          key: ${{ steps.guix-key.outputs.key }}

      - name: Upload update report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-update-report
          path: scripts/check-updates/report.json
          if-no-files-found: warn
