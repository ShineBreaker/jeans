name: Auto Update Packages

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: auto-update

permissions:
  contents: write
  issues: write

env:
  FORGEJO_SERVER_URL: https://codeberg.org
  FORGEJO_REPOSITORY: BrokenShine/jeans

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Guix
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://guix.gnu.org/install.sh -o /tmp/install-guix.sh
          { yes "" 2>/dev/null || true; } | sudo -E bash /tmp/install-guix.sh
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          guix --version

      - name: Run auto-update script
        id: updater
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f /var/guix/current/etc/profile ]; then
            . /var/guix/current/etc/profile
          fi
          if [ -f "$HOME/.config/guix/current/etc/profile" ]; then
            . "$HOME/.config/guix/current/etc/profile"
          fi
          guix shell --manifest=scripts/check-updates/manifest.scm -- \
            env CI=true \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            python3 scripts/check-updates/update_versions.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GPG signing
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          CHANNEL_GPG_PRIVATE_KEY: ${{ secrets.CHANNEL_GPG_PRIVATE_KEY }}
          CHANNEL_GPG_PASSPHRASE: ${{ secrets.CHANNEL_GPG_PASSPHRASE }}
          CHANNEL_GIT_NAME: ${{ vars.CHANNEL_GIT_NAME }}
          CHANNEL_GIT_EMAIL: ${{ vars.CHANNEL_GIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${CHANNEL_GPG_PRIVATE_KEY:-}" ]; then
            echo "GitHub secret CHANNEL_GPG_PRIVATE_KEY is required" >&2
            exit 1
          fi

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          printf 'pinentry-mode loopback\n' > "$HOME/.gnupg/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$HOME/.gnupg/gpg-agent.conf"

          printf '%s\n' "$CHANNEL_GPG_PRIVATE_KEY" | gpg --batch --import

          key_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$key_fpr" ]; then
            echo "Unable to determine imported signing key fingerprint" >&2
            exit 1
          fi

          cat > /tmp/gpg-loopback <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -n "${CHANNEL_GPG_PASSPHRASE:-}" ]; then
            exec gpg --batch --pinentry-mode loopback --passphrase "$CHANNEL_GPG_PASSPHRASE" "$@"
          fi
          exec gpg --batch "$@"
          EOF
          chmod 700 /tmp/gpg-loopback

          git config user.name "${CHANNEL_GIT_NAME:-BrokenShine}"
          git config user.email "${CHANNEL_GIT_EMAIL:-102544159+ShineBreaker@users.noreply.github.com}"
          git config user.signingkey "$key_fpr"
          git config commit.gpgsign true
          git config gpg.program /tmp/gpg-loopback

      - name: Commit updates
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          CHANNEL_GPG_PASSPHRASE: ${{ secrets.CHANNEL_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          git add modules/
          git commit -S -m "UPDATE: auto package update $(date -u +%Y-%m-%d)"

      - name: Push updates to GitHub
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Mirror updated branch to Codeberg
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_USERNAME: ${{ vars.FORGEJO_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "GitHub secret FORGEJO_TOKEN is required" >&2
            exit 1
          fi
          if [ -z "${FORGEJO_USERNAME:-}" ]; then
            echo "GitHub variable FORGEJO_USERNAME is required" >&2
            exit 1
          fi

          remote_url="https://${FORGEJO_USERNAME}:${FORGEJO_TOKEN}@${FORGEJO_SERVER_URL#https://}/${FORGEJO_REPOSITORY}.git"
          git remote add codeberg "$remote_url"
          git push --force codeberg "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-update-report
          path: scripts/check-updates/report.json
          if-no-files-found: warn
