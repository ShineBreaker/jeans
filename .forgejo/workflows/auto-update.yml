name: Auto Update Packages

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: auto-update

jobs:
  auto-update:
    runs-on: codeberg-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Guix
        shell: bash
        run: |
          yes "" | sh <(curl -L https://guix.gnu.org/install.sh)
          source /var/guix/current/etc/profile

      - name: Run auto-update script
        id: updater
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set +e
          source /var/guix/current/etc/profile
          guix shell --manifest=scripts/check-updates/manifest.scm -- \
            env CI=true \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            FORGEJO_TOKEN="$FORGEJO_TOKEN" \
            FORGEJO_REPOSITORY="${{ github.repository }}" \
            python3 scripts/check-updates/update_versions.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updates
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "Update Bot"
          git config user.email "bot@codeberg.org"
          git add modules/
          git commit -m "UPDATE: auto package update $(date +%Y-%m-%d)"
          git push "https://${{ secrets.FORGEJO_TOKEN }}@codeberg.org/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-update-report
          path: scripts/check-updates/report.json
          if-no-files-found: warn
